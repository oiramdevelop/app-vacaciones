<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1a33" />
    <title>Sin conexión · Vacaciones</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1a33; color: #e2e8f0; font-family: system-ui, sans-serif; }
      main { max-width: 360px; padding: 24px; text-align: center; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #8aa0c2; font-size: 14px; line-height: 1.5; margin: 0 0 16px; }
      button { border: 0; border-radius: 8px; background: #2563eb; color: #fff; padding: 10px 16px; font-size: 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>No se puede conectar con el servidor. Tus vacaciones y saldos se consultan en línea para que siempre estén al día.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
